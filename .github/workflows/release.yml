# =============================================================================
# llvm-cygwin Release CI
# =============================================================================
# Builds the full cross-compiler toolchain on ubuntu-latest and publishes
# the package as a GitHub Release when a tag like v1.0.0 is pushed.
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build llvm-cygwin
    runs-on: ubuntu-latest
    env:
      # No local proxy in CI — direct downloads
      PROXY: ""
      JOBS: "4"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: llvm-cygwin

      # Only what build.sh itself needs. Deliberately no libxml2-dev / host
      # clang / llvm / lld: the toolchain is configured with
      # -DLLVM_ENABLE_LIBXML2=OFF and builds its own compilers, so the result
      # no longer depends on which Ubuntu image (22.04 vs 24.04, differing
      # libxml2/clang package versions) the runner happens to use.
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake \
            ninja-build \
            git \
            wget \
            patch \
            gcc \
            g++ \
            xz-utils \
            zstd \
            bzip2
          echo "=== Tool versions ==="
          cmake --version | head -1
          ninja --version
          git --version
          gcc --version | head -1
          patch --version | head -1

      - name: Resolve LLVM version
        id: llvm_version
        working-directory: llvm-cygwin
        run: |
          version="$(sed -n 's/^LLVM_VERSION="\(.*\)"$/\1/p' build.sh | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "LLVM version: $version"

      - name: Download Cygwin patches
        working-directory: llvm-cygwin
        run: bash scripts/fetch-patches.sh

      - name: Download Cygwin sysroot
        working-directory: llvm-cygwin
        run: bash scripts/fetch-sysroot.sh

      - name: Build toolchain
        working-directory: llvm-cygwin
        run: bash build.sh

      - name: Verify bundled runtime libraries
        working-directory: llvm-cygwin
        run: |
          set -e
          for f in \
            toolchain/x86_64-pc-cygwin/lib/libc++.a \
            toolchain/x86_64-pc-cygwin/lib/libc++abi.a \
            toolchain/x86_64-pc-cygwin/lib/libunwind.a \
            toolchain/lib/clang/*/lib/*/libclang_rt.builtins.a; do
            test -f "$f" || { echo "ERROR: missing $f"; exit 1; }
            echo "OK: $f"
          done
          # The packaged tree must be the single llvm-mingw-style root.
          test -d toolchain/generic-pc-cygwin/include
          test -x toolchain/bin/x86_64-pc-cygwin-clang++

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-cygwin-package
          path: llvm-cygwin/llvm-cygwin-*.tar.xz
          retention-days: 7

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "llvm-cygwin ${{ github.ref_name }}"
          body: |
            ## llvm-cygwin ${{ github.ref_name }}

            Pure-LLVM cross-compiler for **Linux → Cygwin/Windows PE** targets.

            ### Included
            - Clang/LLD/libc++/libc++abi/libunwind (LLVM ${{ steps.llvm_version.outputs.version }})
            - Cygwin sysroot (headers, libraries, w32api, libiconv, libintl)

            ### Usage
            ```bash
            tar -xJf llvm-cygwin-*.tar.xz
            cd llvm-cygwin-*/
            source env.sh
            x86_64-pc-cygwin-clang++ -static hello.cpp -o hello.exe
            ```
          files: llvm-cygwin/llvm-cygwin-*.tar.xz
          fail_on_unmatched_files: false
          generate_release_notes: false
